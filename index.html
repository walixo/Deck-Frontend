<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deck — launch, share and discover new tech: AI models, tools, Claude skills, mobile apps and websites. Vote on today's best launches."
    />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <title>Deck — launch, share and discover new tech</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Cpath fill='%23B8A9FA' fill-rule='evenodd' d='M7 6h9c5 0 9 4 9 9v2c0 5-4 9-9 9H7V6Zm7 7v6h2.6c1.6 0 2.4-.8 2.4-2.4v-1.2c0-1.6-.8-2.4-2.4-2.4H14Z'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so there is no light-mode flash on a dark-mode load.
      (function () {
        try {
          var stored = localStorage.getItem('deck-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
