<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Deck — launch, share and discover new tech: AI models, tools, Claude skills, mobile apps and websites. Vote on today's best launches."
    />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Deck — launch, share and discover new tech</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 20.5V11h4.2c3.1 0 5.1 1.8 5.1 4.7s-2 4.8-5.1 4.8H9Z' fill='%2334d399'/%3E%3Ccircle cx='22' cy='20' r='2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so there is no light-mode flash on a dark-mode load.
      (function () {
        try {
          var stored = localStorage.getItem('deck-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
